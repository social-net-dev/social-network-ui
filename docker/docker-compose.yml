services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: social-network-ui
    environment:
      - VITE_API_BASE_URL=/api
      - APP_DOMAIN=:80
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
